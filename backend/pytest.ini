[pytest]
# Pytest configuration for VeriNews test suite

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Test paths
testpaths = tests

# Markers for test categorization
markers =
    unit: Unit tests (isolated component testing)
    integration: Integration tests (service interactions)
    performance: Performance and load tests
    slow: Tests that take more than 1 second
    requires_db: Tests requiring PostgreSQL database
    requires_redis: Tests requiring Redis
    requires_openai: Tests requiring OpenAI API (will be mocked)

# Coverage configuration
addopts =
    --strict-markers
    --verbose
    --color=yes
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    # --cov-fail-under=80  # Disabled initially
    -ra
    --tb=short

# Ignore patterns
norecursedirs = .git .tox dist build *.egg htmlcov .venv

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
