[project]
name = "verinews"
version = "0.1.0"
description = "AI-powered news verification system for social media"
readme = "README.md"
authors = [{ name = "Viet Ngo Quang", email = "vietnq.work@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.38.0",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.11.0",
    "sqlalchemy>=2.0.44",
    "alembic>=1.17.1",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.11",
    "pgvector>=0.4.1",
    "loguru>=0.7.3",
    "pyyaml>=6.0.3",
    "httpx>=0.27.0",
    "ruff>=0.4.4",
    "pre-commit>=3.7.1",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "flower>=2.0.1",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "typer>=0.9.0",
    "justext>=3.0.2",
    "trafilatura>=2.0.0",
    "rich>=14.2.0",
    "readability-lxml>=0.8.4.1",
    "openai>=2.7.1",
    "tenacity>=9.1.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
