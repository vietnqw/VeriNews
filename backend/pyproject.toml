[project]
name = "verinews"
version = "0.1.0"
description = "AI-powered news verification system for social media"
readme = "README.md"
authors = [{ name = "Viet Ngo Quang", email = "vietnq.work@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.38.0",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.11.0",
    "sqlalchemy>=2.0.44",
    "alembic>=1.17.1",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.11",
    "pgvector>=0.4.1",
    "loguru>=0.7.3",
    "pyyaml>=6.0.3",
    "httpx>=0.27.0",
    "ruff>=0.4.4",
    "pre-commit>=3.7.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
