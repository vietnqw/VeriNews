# VeriNews Configuration File
# Application-level settings and business logic parameters

# Celery Configuration
celery:
  broker_url: redis://localhost:6379/0
  result_backend: redis://localhost:6379/0
  worker_count: 4
  task_time_limit: 300

# Scheduler Configuration
scheduler:
  crawler_interval_minutes: 5  # How often to run the news crawler and cleanup tasks

# Crawler Configuration
crawler:
  # Ingest cutoff: skip fetching articles if published_at < now - ingest_max_age_hours.
  ingest_max_age_hours: 48
  # Retention window: delete stored articles if created_at < now - retention_hours.
  retention_hours: 24
  max_articles_per_feed: 50  # Maximum articles to fetch per RSS feed (-1 for unlimited)
  max_content_length: 50000  # Maximum article content length (-1 for unlimited)
  fetch_timeout_seconds: 30  # HTTP request timeout
  user_agent: "VeriNews/2.0"  # User agent for HTTP requests

# AI/ML Configuration
ai:
  provider: "openai"  # AI provider: openai, anthropic, local
  embedding_model: "text-embedding-3-small"  # Embedding model to use
  llm_model: "gpt-4o-mini"  # LLM model to use (gpt-4o-mini, gpt-4o, claude-3-5-sonnet, etc.)
  max_retries: 3  # Maximum retry attempts for API calls
  timeout_seconds: 30  # API request timeout

# Retrieval Pipeline Configuration
retrieval:
  # Vietnamese text processing
  vietnamese_processing:
    enabled: true  # Enable Vietnamese-specific tokenization
    library: "pyvi"  # Vietnamese NLP library (pyvi, underthesea)

  # Vector similarity search
  vector_search:
    top_k: 100  # Number of chunks to retrieve
    similarity_metric: "cosine"  # cosine, l2, inner_product

  # BM25 keyword search
  bm25_search:
    top_k: 100  # Number of chunks to retrieve

  # Hybrid search
  hybrid:
    enable_bm25: true  # Enable BM25 keyword search
    enable_vector: true  # Enable vector similarity search

  # Query extraction from Facebook posts
  query_extraction:
    enabled: true  # Enable LLM-based query extraction
    max_claims: 10  # Maximum number of claims to extract (increased to preserve more information)
    min_factual_confidence: 2  # Minimum confidence to proceed with retrieval (1-3 scale: 1=Opinion, 2=Vague, 3=Verifiable)
    enable_similarity_filter: true  # Enable post-processing similarity filtering for claims
    similarity_threshold: 0.9  # Filter claims above this similarity to clean_query

  # Reciprocal Rank Fusion
  fusion:
    method: "rrf"  # Fusion method: rrf, weighted_sum
    rrf_k: 60  # RRF constant (standard value)

  # Reranking with OpenAI
  reranking:
    enabled: true  # Enable reranking step
    entity_filter:
      enabled: true  # Enable entity-based filtering before reranking
      min_entity_match_ratio: 0.6  # Minimum ratio of query entities that must appear in chunk (0.0-1.0)
    top_n: 10  # Number of chunks to return after reranking
    num_parallel_workers: 4  # Number of parallel workers for scoring (each handles subset of chunks)
    worker_timeout_seconds: 15  # Timeout per worker to prevent long tail latency
    max_concurrent_calls: 4  # Maximum concurrent API calls (rate limiting)
    score_threshold: 5  # Minimum score to include chunk (0-10 scale)

    # Article-level reranking
    article_level:
      enabled: true  # Enable article-level reranking
      num_parallel_workers: 8  # More workers for fewer items (5-15 articles vs 100 chunks)
      worker_timeout_seconds: 5  # Shorter timeout for article-level
      max_concurrent_calls: 8  # Higher concurrency limit
      score_threshold: 7.0  # Minimum article score (0-10 scale)
      max_articles_to_rerank: 15  # Limit articles to rerank (performance optimization)
      min_items_for_split: 4  # If number of articles <= this, send all to one worker for comparative scoring

  # Article aggregation
  aggregation:
    max_articles: 10  # Maximum articles to return
    include_chunks: true  # Include chunk details in response
    min_chunk_score: 5.0  # Minimum max chunk score for article to pass (0-10 scale)

  # Confidence scoring
  confidence_scoring:
    enabled: true  # Enable multi-signal confidence scoring
    min_confidence_threshold: 0.25  # Reject results below this confidence (0-1 scale)
    weights:
      top_article_score: 0.35  # Weight for top article score
      score_gap_ratio: 0.25  # Weight for gap between #1 and #2
      entity_coverage: 0.20  # Weight for entity match completeness
      temporal_alignment: 0.10  # Weight for temporal alignment
      title_similarity: 0.10  # Weight for query-title similarity
    thresholds:
      high: 0.75  # >= 75% = HIGH confidence
      medium: 0.50  # >= 50% = MEDIUM confidence
      low: 0.25  # >= 25% = LOW confidence
      # < 25% = NONE (return "no relevant articles")

  # Redis caching
  cache:
    enabled: true  # Enable result caching
    ttl_hours: 24  # Cache TTL in hours
    redis_key_prefix: "retrieval:"  # Redis key prefix

# Verification Pipeline Configuration
verification:
  enabled: true  # Enable verification service

  # Stance classification (LLM-based NLI)
  stance_classification:
    num_parallel_workers: 4  # Number of parallel workers for stance classification
    worker_timeout_seconds: 10  # Timeout per worker
    min_confidence: 0.6  # Minimum confidence to trust stance classification

  # Verdict aggregation
  aggregation:
    min_evidence_per_claim: 1  # Minimum evidence pieces needed for a verdict
    conflict_mode: "conservative"  # How to handle conflicts: "conservative" (NEI), "majority", "recency"

  # Overall verdict generation
  verdict:
    mode: "worst_case"  # "worst_case" (any refuted = refuted), "majority", "weighted"
    types:
      - "FULLY_SUPPORTED"
      - "PARTIALLY_SUPPORTED"
      - "REFUTED"
      - "NOT_ENOUGH_INFO"

  # Confidence scoring weights (must sum to 1.0)
  confidence_scoring:
    weights:
      evidence_quality: 0.55  # Average LLM confidence in stance classifications (combined with stance_confidence)
      source_agreement: 0.25  # Percentage of sources agreeing on verdict
      claim_coverage: 0.15  # Percentage of claims fully supported
      temporal_relevance: 0.05  # Recency of articles
    thresholds:
      high: 0.75  # >= 75% = HIGH confidence
      medium: 0.50  # >= 50% = MEDIUM confidence
      low: 0.25  # >= 25% = LOW confidence
      # < 25% = NONE

  # Explanation generation
  explanation:
    language: "vi"  # Language for explanations (vi = Vietnamese)
    max_length: 500  # Maximum length of explanation in characters
